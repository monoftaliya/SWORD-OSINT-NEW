
name: Build SWORD OSINT

on:
  workflow_dispatch:
  push:
    paths:
      - 'sword-osint.zip'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Extract project
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "./sword-osint.zip" -DestinationPath "./project" -Force

          if (!(Test-Path "./project/sword-osint/Cargo.toml")) {
            throw "Cargo.toml not found"
          }

      - name: Enable reqwest form feature
        shell: pwsh
        run: |
          $file = "./project/sword-osint/Cargo.toml"
          $content = Get-Content $file -Raw
          $content = $content.Replace('"query"] }', '"query", "form"] }')
          Set-Content -Path $file -Value $content -NoNewline

          if ($content -notmatch '"form"') {
            throw "Could not enable reqwest form feature"
          }

      - name: Install dependencies
        working-directory: project/sword-osint
        run: npm install

      - name: Check frontend
        working-directory: project/sword-osint
        run: npm run check

      - name: Build application
        working-directory: project/sword-osint
        run: npm run app:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SWORD-OSINT-Windows
          path: |
            project/sword-osint/target/release/bundle/nsis/*.exe
            project/sword-osint/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
